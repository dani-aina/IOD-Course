<html lang="en">
  <head>
    <title>Calculator Example</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>My Calculator</h2>
    <div class="calculator">
      <input type="number" id="num1" placeholder="Enter number" />
      <input type="number" id="num2" placeholder="Enter number" />
      <div class="clear-row">
        <button id="clearBtn">C</button>
      </div>
      <div class="button-row">
        <button id="addBtn">+</button>
        <button id="subtractBtn">−</button>
        <button id="multiplyBtn">×</button>
        <button id="divideBtn">÷</button>
      </div>

      <div id="result-box">Result: <span id="result"></span></div>
    </div>
  </body>
  <script>
    document.getElementById("addBtn").addEventListener("click", () => {
      const num1 = document.getElementById("num1").value;
      const num2 = document.getElementById("num2").value;

      fetch(`/calculator/add?num1=${num1}&num2=${num2}`)
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("result").textContent = data.result;
        });
    });

    document.getElementById("subtractBtn").addEventListener("click", () => {
      const num1 = document.getElementById("num1").value;
      const num2 = document.getElementById("num2").value;

      fetch(`/calculator/subtract?num1=${num1}&num2=${num2}`)
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("result").textContent = data.result;
        });
    });

    document.getElementById("multiplyBtn").addEventListener("click", () => {
      const num1 = document.getElementById("num1").value;
      const num2 = document.getElementById("num2").value;

      fetch(`/calculator/multiply?num1=${num1}&num2=${num2}`)
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("result").textContent = data.result;
        });
    });

    document.getElementById("divideBtn").addEventListener("click", () => {
      const num1 = document.getElementById("num1").value;
      const num2 = document.getElementById("num2").value;

      fetch(`/calculator/divide?num1=${num1}&num2=${num2}`)
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("result").textContent = data.result;
        });
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("num1").value = "";
      document.getElementById("num2").value = "";
      document.getElementById("result").textContent = "";
    });
  </script>
</html>
